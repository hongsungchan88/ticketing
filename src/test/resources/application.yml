# 테스트 전용: MySQL 없이 인메모리 H2로 실행 (main 설정 위에 덮어씀)
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
jwt:
  secret: a-very-secure-secret-key-for-ticketing-system-which-is-long-enough
